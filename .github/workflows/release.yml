# 发布流水线：人在 main 上打 tag vX.Y.Z 触发（唯一发布闸门）。
# 构建 linux/amd64 单二进制（内嵌前端、ldflags 注入版本号）→ 打成 docker 镜像 →
# GitHub Release 存档镜像 tar。部署须通过平台「在线更新」或 deploy.yml 手动触发。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 必须打在 main 上
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::tag 不在 main 上——只允许对 CI 通过并合入 main 的提交发版"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 构建前端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 构建单二进制（内嵌前端）
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          cp -r ../web/dist internal/web/dist
          go build -tags embedweb -trimpath \
            -ldflags "-s -w -X github.com/Yukiho0287/assay/server/internal/version.Version=${GITHUB_REF_NAME}" \
            -o assay ./cmd/assay

      - name: 构建镜像并导出
        run: |
          mkdir -p stage
          cp server/assay stage/assay
          docker build -f deploy/Dockerfile -t "assay:${GITHUB_REF_NAME}" stage
          docker save "assay:${GITHUB_REF_NAME}" | gzip > "assay-${GITHUB_REF_NAME}-image.tar.gz"
          sha256sum "assay-${GITHUB_REF_NAME}-image.tar.gz" > "assay-${GITHUB_REF_NAME}-image.tar.gz.sha256"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            "assay-${GITHUB_REF_NAME}-image.tar.gz" \
            "assay-${GITHUB_REF_NAME}-image.tar.gz.sha256"
