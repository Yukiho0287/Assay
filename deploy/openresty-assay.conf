# Assay 平台入口（安装到 /opt/1panel/www/conf.d/assay.conf）
# 手工管理文件，勿通过 1Panel 面板编辑；蓝绿切流只改同目录 assay-upstream.conf。

# 前面挂了 CDN（EdgeOne 回源走明文 8321）时，$scheme 恒为 http，
# 直接用它会把 CDN 传来的真实客户端协议覆盖掉，导致后端判成明文、不下发 Secure Cookie。
# 有传入值就沿用，没有才回落 $scheme（直连源站的管理员兜底通道走这条）。
map $http_x_forwarded_proto $assay_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8321;

    location / {
        proxy_pass http://assay_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $assay_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;      # SSE 进度推送不缓冲
        proxy_read_timeout 3600s; # 检测任务 SSE 长连接
        client_max_body_size 50m;
    }
}
